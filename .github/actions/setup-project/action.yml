name: "Python CI"
description: "Sets up Python and Poetry, then runs Ruff and Pytest"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      id: cache-poetry
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    - name: Install Dependencies
      shell: bash
      run: poetry install --with dev

    - name: Check code formatting and lint (Ruff)
      shell: bash
      run: |
        poetry run ruff format . --check
        poetry run ruff check .

    - name: Run tests (Pytest)
      shell: bash
      run: poetry run pytest
